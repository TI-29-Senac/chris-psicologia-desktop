<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Chris Psicologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="./src/Renderer/modal.css">
</head>

<body>
  <div class="login-wrapper">
    <div class="visual-container">
      <div class="bg-carousel">
        <div class="bg-image active" style="background-image: url('./img/chris-desktop.png');"></div>
        <div class="bg-image" style="background-image: url('./img/helena-desktop.png');"></div>
        <div class="bg-image" style="background-image: url('./img/yan-desktop.png');"></div>
        <div class="bg-image" style="background-image: url('./img/carla-desktop.png');"></div>
      </div>
      <div class="visual-overlay"></div>

      <div class="glass-card">

      </div>
      <div class="visual-text-content">
        <h1 class="visual-title">Área Administrativa</h1>
        <p class="visual-subtitle">Gestão profissional com cuidado e confidencialidade</p>
      </div>
    </div>

    <div class="login-container">
      <div class="login-content">
        <h2 class="login-title">Acesso seguro</h2>
        <p class="login-subtitle">Área administrativa</p>

        <form id="login-form">
          <div class="input-group">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-envelope input-icon"></i>
              <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="senha">Senha</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>
          </div>

          <div class="login-actions">
            <button type="submit" id="btn-login">
              <i class="fa-solid fa-lock button-icon"></i> ENTRAR
            </button>
            <a href="#" id="link-forgot-password" class="forgot-password-link">Esqueci minha senha</a>
          </div>
        </form>

        <p class="security-msg"><i class="fa-solid fa-shield-halved"></i> Ambiente seguro e confidencial</p>
        <p id="mensagem-erro" class="error-msg"></p>
      </div>
    </div>

    <!-- Modal Recuperação de Senha -->
    <div id="modal-forgot-password" class="modal-overlay">
      <div class="modal-content">
        <h3>Recuperar Senha</h3>
        <p>Digite seu e-mail para receber as instruções de recuperação.</p>
        <div class="input-group">
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="email-recovery" placeholder="seu@email.com">
          </div>
        </div>
        <p id="msg-recovery" class="status-msg"></p>
        <div class="modal-actions">
          <button id="btn-cancel-recovery" class="btn-secondary">Cancelar</button>
          <button id="btn-send-recovery" class="btn-primary">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/renderer.js"></script>
</body>

</html>
