<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Chris Psicologia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="login-container">
    <div class="login-hero">
      <div class="hero-content">
        <h1 class="hero-title">Seu trabalho transforma vidas.</h1>
        <p class="hero-subtitle">A excelência no cuidado começa com uma gestão organizada. Bom trabalho!</p>
      </div>
      <div class="hero-overlay"></div>
    </div>

    <div class="login-form-wrapper">
      <div class="login-card animate-fade-up">
        <div class="brand-login mb-4">
          <span
            style="font-family: 'Times New Roman', serif; font-size: 2.5rem; font-weight: bold; color: #5D6D68;">&#936;</span>
          <div><span class="logo-text-bold">CHRIS</span> <span class="logo-text-light">PSICOLOGIA</span></div>
        </div>
        <p class="subtitle">Bem-vindo(a) de volta</p>

        <form id="login-form">
          <div class="input-group">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="senha">Senha</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="senha" placeholder="Sua senha" required>
            </div>
          </div>

          <button type="submit" id="btn-login" class="btn-primary-lg">
            <span>Entrar</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <p id="mensagem-erro" class="error-msg"></p>

        <div class="login-footer">
          <p>© 2024 Chris Psicologia - Sistema de Gestão</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/renderer.js"></script>
</body>

</html>
